<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2451d6">
<title>Objection Playbook</title>
<style>
:root{
  --bg:#f5f6f8;--panel:#ffffff;--panel2:#fafbfc;--ink:#15181e;--muted:#5d6472;--line:#e2e5ea;
  --accent:#2451d6;--accent-soft:#e8eefc;--accent-ink:#ffffff;
  --ok:#17693d;--ok-soft:#e5f4ea;--warn:#8a5200;--warn-soft:#fff3dc;--bad:#b02a1c;--bad-soft:#fdecea;
  --chip:#eef0f4;--ph:#fff0c2;--ph-ink:#5a4300;--shadow:0 1px 2px rgba(0,0,0,.05),0 2px 8px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1115;--panel:#171a20;--panel2:#1c2027;--ink:#e8eaee;--muted:#9aa2b1;--line:#2a2f38;
    --accent:#7b9cff;--accent-soft:#1f2a47;--accent-ink:#0f1115;
    --ok:#6fd49a;--ok-soft:#15301f;--warn:#f0b35a;--warn-soft:#33260f;--bad:#ff8a7a;--bad-soft:#3a1714;
    --chip:#242933;--ph:#4a3b0c;--ph-ink:#ffe39a;--shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1115;--panel:#171a20;--panel2:#1c2027;--ink:#e8eaee;--muted:#9aa2b1;--line:#2a2f38;
  --accent:#7b9cff;--accent-soft:#1f2a47;--accent-ink:#0f1115;
  --ok:#6fd49a;--ok-soft:#15301f;--warn:#f0b35a;--warn-soft:#33260f;--bad:#ff8a7a;--bad-soft:#3a1714;
  --chip:#242933;--ph:#4a3b0c;--ph-ink:#ffe39a;--shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:10;background:var(--panel);border-bottom:1px solid var(--line)}
.bar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;padding:10px 16px;max-width:1500px;margin:0 auto}
.brand{font-weight:700;font-size:16px;letter-spacing:-.01em;margin-right:6px;white-space:nowrap}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{border:0;background:transparent;padding:6px 11px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:600;font-size:14px}
.tab[aria-selected="true"]{background:var(--accent-soft);color:var(--accent)}
.search{flex:1 1 260px;min-width:0;position:relative}
.search input{width:100%;padding:8px 12px 8px 34px;border:1px solid var(--line);border-radius:9px;background:var(--panel2);outline:none}
.search input:focus{border-color:var(--accent)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:.55}
.kbd{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 5px}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--panel2)}
.seg button{border:0;background:transparent;padding:6px 10px;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg-label{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.theme{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:5px 9px;cursor:pointer;font-size:13px}
.clock{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;padding:5px 2px}
main{max-width:1500px;margin:0 auto;padding:16px}
.credit{text-align:center;padding:18px 16px 28px;color:var(--muted);font-size:12.5px}
.view{display:none}.view.on{display:block}
/* Objections layout */
.ob-grid{display:grid;grid-template-columns:340px 1fr;gap:16px;align-items:start}
.list{position:sticky;top:78px;max-height:calc(100vh - 96px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.cats{display:flex;flex-wrap:wrap;gap:6px;padding:12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:1}
.chip{border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:3px 10px;font-size:12.5px;cursor:pointer;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.group-h{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;padding:12px 14px 4px}
.item{display:block;width:100%;text-align:left;border:0;background:transparent;padding:8px 14px;cursor:pointer;border-left:3px solid transparent}
.item:hover{background:var(--panel2)}
.item[aria-current="true"]{background:var(--accent-soft);border-left-color:var(--accent)}
.item .t{font-weight:600;font-size:14px;display:block}
.item .s{font-size:12.5px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .hot{color:var(--bad);font-size:11px;font-weight:700;margin-left:4px}
.empty{padding:20px 14px;color:var(--muted)}
.detail{min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;box-shadow:var(--shadow);margin-bottom:14px}
.d-head h2{margin:2px 0 6px;font-size:22px;letter-spacing:-.015em;line-height:1.25}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.badge{font-size:12px;font-weight:600;border-radius:6px;padding:2px 8px;background:var(--chip);color:var(--muted)}
.badge.tech{background:var(--accent-soft);color:var(--accent)}
.badge.tier{background:var(--ok-soft);color:var(--ok)}
.badge.hot{background:var(--bad-soft);color:var(--bad)}
h3{font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:18px 0 8px}
h3:first-child{margin-top:0}
.says{display:flex;flex-wrap:wrap;gap:6px}
.says span{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:14px}
.goal{background:var(--accent-soft);border-radius:10px;padding:10px 14px;font-weight:500}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:700}
.tbl-wrap{overflow-x:auto}
.script{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;background:var(--panel2);position:relative}
.script .lab{display:flex;gap:8px;align-items:center;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:6px;padding-right:70px}
.script .txt{font-size:16px;line-height:1.55}
.copy{position:absolute;top:9px;right:9px;border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:3px 9px;font-size:12px;cursor:pointer;font-weight:600}
.copy.done{color:var(--ok);border-color:var(--ok)}
.ph{background:var(--ph);color:var(--ph-ink);border-radius:4px;padding:0 3px;font-weight:600}
.vf{background:var(--warn-soft);color:var(--warn);border-radius:4px;padding:0 4px;font-size:12px;font-weight:700;overflow-wrap:anywhere;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.ok-text{color:var(--ok);font-weight:700}
.bad-text{color:var(--bad);font-weight:700}
.qa{border-left:3px solid var(--accent);padding:4px 0 4px 12px;margin-bottom:12px}
.qa .q{font-weight:700;margin-bottom:3px}
.qa .a{font-size:15.5px}
ul.dont,ul.verify{margin:0;padding:0;list-style:none}
ul.dont li{background:var(--bad-soft);color:var(--bad);border-radius:8px;padding:6px 10px;margin-bottom:6px;font-size:14px}
ul.dont li b{color:var(--bad)}
ul.verify li{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:6px 10px;margin-bottom:6px;font-size:14px}
.related a{display:inline-block;margin:0 6px 6px 0;color:var(--accent);text-decoration:none;font-weight:600;font-size:14px;background:var(--accent-soft);padding:3px 10px;border-radius:7px}
.hides{display:grid;grid-template-columns:repeat(var(--n,5),1fr);gap:6px;margin-top:4px}
.hides div{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:8px;font-size:12.5px;line-height:1.35}
.hides b{display:block;font-size:18px;color:var(--accent)}
.tier-note{font-size:13px;color:var(--ok);background:var(--ok-soft);border-radius:8px;padding:6px 10px;margin-bottom:10px;font-weight:600}
.back{display:none;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 12px;margin-bottom:10px;cursor:pointer;font-weight:600}
/* Flow & facts */
.wrap{max-width:1050px;margin:0 auto}
.step{display:grid;grid-template-columns:44px 1fr;gap:12px;margin-bottom:12px}
.num{width:36px;height:36px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700}
.step h4{margin:4px 0 6px;font-size:17px}
.step p{margin:0 0 8px;color:var(--muted)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card h2{font-size:18px;margin:0 0 10px}
.note{font-size:13px;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.field label{font-size:12.5px;font-weight:700;color:var(--muted)}
.field input,.field select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel2)}
.fields{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.home-top{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.leak{text-align:left;border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:10px 12px;cursor:pointer}
.leak b{display:block;font-size:14.5px}.leak span{font-size:12.5px;color:var(--muted)}
.cx{font-style:italic;background:var(--panel2);border-left:3px solid var(--muted);padding:8px 12px;border-radius:0 8px 8px 0;font-size:15px}
.whosays{font-size:13.5px;color:var(--muted);margin-top:10px}
.qa{position:relative;padding-right:64px}
.qa .copy{top:2px}
.qa .badge{margin-bottom:4px;display:inline-block}
.badge.pt-escape{background:var(--warn-soft);color:var(--warn)}
.badge.pt-repeat{background:var(--accent-soft);color:var(--accent)}
.badge.pt-new{background:var(--ok-soft);color:var(--ok)}
.badge.pt-emotion{background:var(--bad-soft);color:var(--bad)}
.badge.pt-authority{background:var(--chip);color:var(--ink)}
.related-link{color:var(--accent);font-weight:600;text-decoration:none}
.chat{display:flex;flex-direction:column;gap:10px}
.bub{max-width:82%;border-radius:12px;padding:10px 14px;position:relative;font-size:15.5px;line-height:1.5}
.bub .bw{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:3px}
.bub.c{align-self:flex-start;background:var(--panel2);border:1px solid var(--line)}
.bub.p{align-self:flex-start;background:var(--bad-soft);border:1px solid var(--bad)}
.bub.p .bw{color:var(--bad)}
.bub.a{align-self:flex-end;background:var(--accent-soft);padding-right:70px}
.tn{color:var(--accent);text-transform:none;letter-spacing:0}
.lesson{margin-top:14px;background:var(--ok-soft);color:var(--ok);border-radius:10px;padding:10px 14px}
.dies{margin-top:10px;background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:8px 12px;font-size:14px}
.scen-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.leak[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.stage-sel{border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:3px 8px;font-size:12.5px;font-weight:600;color:var(--muted);max-width:100%}
.stn{display:inline-block;min-width:16px;text-align:center;font-size:10.5px;font-weight:700;background:var(--chip);color:var(--muted);border-radius:4px;padding:0 3px;margin-right:4px}
.stages{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13.5px}
.schip,.ochip{border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--accent)}
.schip:hover,.ochip:hover{background:var(--accent-soft)}
.prevent{background:var(--ok-soft);color:var(--ok);border-radius:10px;padding:8px 12px;font-weight:600}
.obj-at{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}
.obj-at summary{cursor:pointer;list-style-position:inside}
.oa-h{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--bad)}
.ochips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.qgroup{margin-bottom:12px}
.qg-h{font-weight:700;font-size:14px;margin-bottom:4px}
.qlist{margin:0;padding:0;list-style:none}
.qlist li{padding:6px 0;border-bottom:1px solid var(--line)}
.qlist li:last-child{border-bottom:0}
.qq{display:block;font-size:15.5px}
.ql{display:block;font-size:13px;color:var(--muted)}
.step.flash{outline:2px solid var(--accent);outline-offset:2px}
.pacer{position:sticky;top:78px;z-index:5}
.pace-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.pbtn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:9px;padding:6px 14px;font-weight:700;cursor:pointer}
.pbtn.ghost{background:var(--panel2);color:var(--muted);border-color:var(--line)}
.pace-time{font-variant-numeric:tabular-nums;font-size:22px;font-weight:700;letter-spacing:.02em}
.pchips{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:6px;margin-top:10px}
.pchip{text-align:left;border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:7px 10px;cursor:pointer}
.pchip b{display:block;font-size:13px}
.pchip span{font-size:11.5px;color:var(--muted)}
.pchip.on{border-color:var(--accent);background:var(--accent-soft)}
.pchip.on b{color:var(--accent)}
.phase-h{display:flex;gap:12px;align-items:flex-start;background:var(--accent-soft);border-radius:12px;padding:12px 16px;margin:18px 0 12px;font-size:14px}
.ph-n{font-weight:800;color:var(--accent);white-space:nowrap;font-size:13px;padding-top:2px}
.mins{font-size:11.5px;font-weight:700;background:var(--chip);color:var(--muted);border-radius:6px;padding:2px 7px;margin-left:8px;vertical-align:middle}
.goalline{background:var(--panel2);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:8px 12px;margin-bottom:12px;font-size:14px}
.clar{position:relative;border:1px dashed var(--warn);background:var(--warn-soft);border-radius:10px;padding:10px 70px 10px 12px;margin-bottom:8px}
.clar-h{font-size:12px;font-weight:700;color:var(--warn);text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px}
.clar-t{font-size:15.5px}
.qc{display:block;font-size:13px;color:var(--warn);margin-top:2px}
.exits{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:14px;cursor:pointer}
.chk input{margin-top:3px}
@media (max-width:860px){.pacer{position:static}}
.replies{margin:10px 0 4px}
.rp-h{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:6px}
.reply{position:relative;border:1px solid var(--line);border-radius:10px;padding:10px 70px 10px 12px;margin-bottom:8px;background:var(--panel)}
.rp-top{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.rp-c{font-style:italic;font-size:15px;margin-bottom:4px}
.rp-a{font-size:15.5px}
.sent{display:inline-block;font-size:11.5px;font-weight:700;border-radius:6px;padding:1px 8px;white-space:nowrap}
.s-warm{background:var(--ok-soft);color:var(--ok)}
.s-pain{background:var(--accent-soft);color:var(--accent)}
.s-neutral{background:var(--chip);color:var(--muted)}
.s-deflect{background:var(--warn-soft);color:var(--warn)}
.s-suspicious{background:var(--chip);color:var(--ink)}
.s-rushed{background:var(--bad-soft);color:var(--bad)}
.meter{display:inline-flex;gap:2px;vertical-align:middle}
.meter i{width:10px;height:6px;border-radius:2px;background:var(--line)}
.meter i.on{background:var(--ok)}
.rline{margin-bottom:14px}
.rp-wrap summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--accent);margin:-2px 0 6px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.kpi b{display:block;font-size:26px}
.kpi span{font-size:12.5px;color:var(--muted)}
.loglist{margin:0 0 10px;padding:0;list-style:none}
.loglist li{position:relative;padding:8px 80px 8px 0;border-bottom:1px solid var(--line);font-size:14px}
.loglist .copy{top:6px}
.focusline{margin-top:10px;background:var(--ok-soft);color:var(--ok);border-radius:8px;padding:6px 10px;font-size:14px}
.pbtn[disabled]{opacity:.45;cursor:not-allowed}
.zip-row{display:flex;gap:8px;flex-wrap:wrap}
.zip-row input{flex:0 1 180px;padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:var(--panel2);font-size:18px;letter-spacing:.08em}
.rgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.rlist{margin:0;padding-left:20px}
.rlist li{padding:5px 0;border-bottom:1px solid var(--line)}
.rlist li:last-child{border-bottom:0}
@media (max-width:980px){.rgrid{grid-template-columns:1fr}}
@media (max-width:980px){.hides{grid-template-columns:repeat(4,1fr)}.cols{grid-template-columns:1fr}.fields{grid-template-columns:1fr 1fr}}
@media (max-width:860px){
  .ob-grid{grid-template-columns:1fr}
  .list{position:static;max-height:none}
  .ob-grid.show-detail .list{display:none}
  .ob-grid:not(.show-detail) .detail{display:none}
  .back{display:inline-block}
  .bar{padding:10px 16px}
  main{padding:12px 16px}
  .card{padding:14px}
  .hides{grid-template-columns:repeat(2,1fr)}
  .fields{grid-template-columns:1fr}
  .kbd{display:none}
  .bub{max-width:100%}
}
@media print{header,.list,.copy,.back{display:none!important}.ob-grid{display:block}}

/* ---------- Phone layout ---------- */
.totop{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--ink);box-shadow:0 2px 10px rgba(0,0,0,.15);font-size:20px;cursor:pointer;display:none;z-index:20}
.totop.show{display:block}
@media (max-width:860px){
  header{position:static}
  .bar{gap:8px;padding:10px 12px}
  .brand{flex:1 1 auto;font-size:17px}
  .theme{order:2;min-width:40px;min-height:40px}
  .tabs{order:3;flex:1 1 100%;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;gap:2px;margin:0 -12px;padding:0 12px}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;padding:9px 12px;font-size:14.5px}
  .search{order:4;flex:1 1 100%}
  .seg-label{display:none}
  .seg{order:5;flex:1 1 100%;overflow-x:auto;scrollbar-width:none}
  .seg button{flex:1 0 auto;padding:9px 8px;font-size:13.5px}
  input[type=search],input[type=text],input:not([type]),input[inputmode],select{font-size:16px!important}
  .copy{padding:7px 12px;font-size:13px}
  .script{padding-top:14px}
  .script .lab{padding-right:78px}
  .qa{padding-right:78px}
  .reply{padding-right:78px}
  .clar{padding-right:78px}
  .item{padding:11px 14px}
  .chip,.schip,.ochip,.stage-sel{padding:7px 12px;font-size:13.5px}
  .cats{position:static}
  .step{grid-template-columns:34px 1fr;gap:10px}
  .num{width:30px;height:30px;font-size:14px}
  .d-head h2{font-size:20px}
  .kpis{grid-template-columns:1fr 1fr 1fr;gap:6px}
  .kpi b{font-size:20px}
  .pchips{grid-template-columns:1fr 1fr}
  .phase-h{flex-direction:column;gap:4px}
  .rgrid{grid-template-columns:1fr}
  .zip-row input{flex:1 1 140px}
  th,td{padding:7px 8px}
}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand">Objection Playbook</div>
    <div class="seg" id="productSeg" role="tablist" aria-label="Product">
      <button data-product="tv" aria-pressed="true">📺 TV</button>
      <button data-product="internet" aria-pressed="false">🛰️ Internet</button>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-view="obj" aria-selected="true">Objections</button>
      <button class="tab" role="tab" data-view="scen" aria-selected="false" data-tv-only="1">Live scenarios</button>
      <button class="tab" role="tab" data-view="flow" aria-selected="false" data-tv-only="1">Call flow</button>
      <button class="tab" role="tab" data-view="rapport" aria-selected="false" data-tv-only="1">Rapport by zip</button>
      <button class="tab" role="tab" data-view="rapport2" aria-selected="false" data-tv-only="1">Rapport by zip 2</button>
      <button class="tab" role="tab" data-view="lock" aria-selected="false" data-tv-only="1">Lock-in</button>
      <button class="tab" role="tab" data-view="facts" aria-selected="false">Quick facts</button>
      <button class="tab" role="tab" data-view="stats" aria-selected="false">My stats</button>
    </div>
    <span class="clock" id="localClock" title="Local time"></span>
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Type what the customer said… (e.g. “paid on the 1st”)" autocomplete="off">
      <span class="kbd">/</span>
    </div>
    <div id="tierWrap" style="display:flex;align-items:center;gap:8px">
      <span class="seg-label">Tier</span>
      <div class="seg" id="tierSeg">
        <button data-tier="all" aria-pressed="true">All</button>
        <button data-tier="ep" aria-pressed="false">Elite / Plus</button>
        <button data-tier="f24" aria-pressed="false">Flex24</button>
        <button data-tier="ftv" aria-pressed="false">FlexTV</button>
      </div>
    </div>
    <button class="theme" id="themeBtn" title="Toggle light/dark">◐</button>
  </div>
</header>

<main>
  <!-- OBJECTIONS -->
  <section class="view on" id="view-obj">
    <div class="ob-grid" id="obGrid">
      <nav class="list" id="list" aria-label="Objections">
        <div class="cats" id="cats"></div>
        <div id="items"></div>
      </nav>
      <div class="detail" id="detail"></div>
    </div>
  </section>

  <!-- CALL FLOW -->
  <section class="view" id="view-flow"><div class="wrap" id="flow"></div></section>

  <!-- FACTS -->
  <section class="view" id="view-facts"><div class="wrap" id="facts"></div></section>

  <!-- SCENARIOS -->
  <section class="view" id="view-scen"><div class="wrap" id="scen"></div></section>

  <!-- RAPPORT -->
  <section class="view" id="view-rapport"><div class="wrap" id="rapport"></div></section>

  <!-- RAPPORT BY ZIP 2 (same tool, can use the IT-approved lookup service) -->
  <section class="view" id="view-rapport2"><div class="wrap" id="rapport2"></div></section>

  <!-- MY STATS -->
  <section class="view" id="view-stats"><div class="wrap" id="stats"></div></section>

  <!-- LOCK-IN -->
  <section class="view" id="view-lock"><div class="wrap" id="lock"></div></section>
</main>
<footer class="credit">Created by Zaki</footer>

<script>
/* ===================== DATA ===================== */
const CATS_TV = {
  open:  "Opening & call types",
  info:  "Info & credit",
  money: "Money & payment",
  price: "Price & terms",
  product:"Product & service",
  trust: "Trust & history",
  close: "Closing stalls"
};
const CATS_INTERNET = {
  basics:  "What even is this?",
  setup:   "Setup, equipment & install",
  money:   "Price, billing & contract",
  reliability: "Will it actually work?",
  compat:  "My devices, email & the grandkids",
  trust:   "Is this safe / is it a scam?",
  close:   "Closing stalls"
};
const CATS_BY_PRODUCT = { tv: CATS_TV, internet: CATS_INTERNET };
function catsFor(p){ return CATS_BY_PRODUCT[p] || CATS_TV; }
const TIERS = {all:"All tiers", ep:"Elite / Plus", f24:"Flex24", ftv:"FlexTV"};

/* Script: [label, text, tier]. Placeholders in {braces}. [VERIFY ...] gets highlighted. */
const O = [];
function add(o){ o.product = o.product || "tv"; O.push(o); }

/* ---------- OPENING & CALL TYPES ---------- */
add({id:"price-first", cat:"open", hot:true, title:"“Just give me the price”",
 sub:"Shopper wants a number before giving info",
 say:["How much is it?","Just give me the price","What’s your cheapest package?","I don’t want to give my info, just tell me the price"],
 means:[["Comparing providers, collecting quotes","Give a reason + a reward for 60 seconds of info"],["Afraid of a long sales pitch","Up-front contract: tell them exactly how short this is"],["Burned by bait-and-switch before","Explain price depends on qualification, that’s the honest part"],["Genuinely in a hurry","Speed: “one minute, then exact numbers”"]],
 goal:"Get permission to capture info and qualify, without stonewalling or lying about having prices.",
 tech:["Up-front contract","Reciprocity","No-oriented Q"],
 scripts:[
  ["Main: honest reason","Totally fair, you want a real number, not a sales pitch. The honest answer is your price depends on the plan you qualify for, and I don’t want to give you a number that doesn’t apply to you. Give me about a minute for your name and address, and I’ll give you your exact price, not a range. Fair enough?"],
  ["Up-front contract","Here’s how this goes: I grab a few details, I tell you your exact monthly price and what’s due today, and then you tell me yes, no, or what you need to decide. Sound okay?"],
  ["Hook (only if allowed)","Packages on the website start at $94.99 a month for 190 channels with the Hopper DVR, and some customers pay nothing today to get started. Let me check which one you’d actually get. [VERIFY: allowed to quote public prices before qualification]"],
  ["No-oriented","Would it be a bad idea to check your real number instead of me guessing? It takes about a minute and then you’ll know for sure."]
 ],
 push:[["“Just give me a ballpark.”","I could, but a ballpark is how people end up with a bill that doesn’t match what they were told, that’s the #1 complaint about TV companies. One minute and you get the real one. What’s your first name?"],
       ["“I’m not giving my info.”","That’s okay. Is it the credit check you’re worried about, or giving info out in general? → go to “Why do you need my info?”"]],
 dont:["“I can’t give prices.” (not true)","“It’s required by law.” (not true)","Stalling with more and more questions until they get angry"],
 verify:["Whether any range or “starting at” figure can be quoted before qualification"],
 rel:["why-info","just-looking","flyer"]
});

add({id:"flyer", cat:"open", hot:true, title:"“Can you mail me a flyer?”",
 sub:"Wants something printed to “think about”",
 say:["Can you mail me a brochure?","Send me a flyer","Mail me the info and I’ll look at it","Do you have a pamphlet?"],
 means:[["Wants time to think","Isolate what they’d be thinking about"],["Wants something in writing (trust)","Give exact numbers now to write down; recap every line"],["Polite exit","Permission to say no"],["Needs to show spouse","→ spouse objection"]],
 goal:"Replace the flyer with something better: their exact numbers, right now.",
 tech:["Label","Calibrated Q","Reframe"],
 scripts:[
  ["Main: reframe","I wish I could, we don’t mail flyers. And honestly, a flyer would only show the ad price, not your price, which depends on the plan you qualify for. What I can do is give you your exact numbers in about two minutes so you can write them down. What would you want to see on it?"],
  ["Diagnose","What would the flyer help you decide, the price, the channels, or the contract? Let’s look at that part right now."],
  ["Something in writing","If what you want is to see it in writing, I’ll go through every number and you can write them down line by line, and the agreement itself spells out everything before anything is final. [VERIFY: what written confirmation/email the customer gets and when]"]
 ],
 push:[["“I still want something mailed.”","I understand. Since I can’t mail it, would it be crazy to write down these five things with me, package, monthly price, what’s due today, how long it’s locked, and the install date? Then you have everything a flyer would tell you, and more."]],
 dont:["“I’ll send one out.” (we can’t)","“Check your mailbox next week.”"],
 verify:["Whether you may direct customers to dish.com/packages for channel lists","Whether a quote/order summary can be emailed"],
 rel:["email-info","think","spouse"]
});

add({id:"email-info", cat:"open", title:"“Just email me the details”",
 sub:"Wants info sent instead of deciding",
 say:["Email me the quote","Send it to my email and I’ll look","Can you text me the info?"],
 means:[["Wants to compare later","Give the numbers now; offer to stay on while they compare"],["Wants a record (trust)","Recap every line; explain the agreement is emailed/shown before activation"],["Exit","Isolate + path back"]],
 goal:"Keep the decision on this call; if something can be sent, send it as part of the order, not instead of it.",
 tech:["Label","Isolate","If-then plan"],
 scripts:[
  ["Main","Happy to make sure you have it in writing. Before I do, it sounds like you like what you’ve heard and just want to see it laid out. Is that right? Let me lay it out right now, line by line, and you tell me if anything doesn’t look right."],
  ["Isolate","If everything on that email looked the way I just said it, would you be ready to go ahead?"],
  ["Order paperwork","Once we set it up, your agreement lays out every price and fee before anything is final, so you’re never guessing. [VERIFY: how/when agreement or confirmation is sent]"]
 ],
 dont:["Promising an email quote your system can’t send"],
 verify:["Can a quote be emailed before an order? After?"],
 rel:["flyer","think"]
});

add({id:"streaming", cat:"open", hot:true, title:"“Do you have streaming?”",
 sub:"Wants an app / streaming service",
 say:["Is this streaming?","I want an app, not a dish","Do you have something like YouTube TV?","I cut the cord","Can I watch it on my Roku?"],
 means:[["Assumes DISH is streaming","Honest no, then pivot"],["Wants no equipment / no install","Explain what’s included and free install"],["Wants cheaper","Compare total cost honestly"],["Bad or slow internet","Satellite doesn’t use internet, real strength"]],
 goal:"Say “no” honestly in one sentence, find out WHY they want streaming, and pivot only if satellite truly fits.",
 tech:["Label","Calibrated Q","Reframe (Challenger)"],
 scripts:[
  ["Main: honest + diagnose","We’re satellite TV, not a streaming service, so you get a dish and a DVR instead of an app. Can I ask what’s making you look at streaming, the price, not wanting a contract, or not wanting equipment?"],
  ["Internet angle","A lot of people come to us because streaming depends on your internet, when it slows down, the TV buffers. Satellite doesn’t use your internet at all. How’s your internet at home?"],
  ["Features","You still get the DISH Anywhere app to watch on your phone or tablet, and the Hopper records up to 16 shows at once and skips commercials on select primetime shows."],
  ["Honest fit check","If you only watch two or three apps, satellite might not be the right fit and I’ll tell you that. If you watch live TV, sports and news, this is where satellite wins. Which one sounds more like your house?"]
 ],
 push:[["“Streaming is cheaper.”","It can be. What are you paying for your apps and internet together? Let’s compare the full number, not just one app. → see “Cheaper elsewhere”"],
       ["“I don’t want a dish on my house.”","That’s fair. What bothers you about it, how it looks, the install, or the landlord? → see “Landlord / HOA”"]],
 dont:["Calling DISH a streaming service","Trashing streaming services","Recommending another company’s product"],
 verify:["Whether you may mention Netflix add-ons billed through DISH","Approved wording for DISH Anywhere"],
 rel:["cheaper","landlord","weather"]
});

add({id:"one-question", cat:"open", title:"One-question caller",
 sub:"Asks one thing, gets the answer, hangs up",
 say:["I just had one question","Quick question , ","I only wanted to know if…","That’s all I needed, thanks"],
 means:[["Pre-shopping / curious","Answer fully, then earn one more minute"],["Existing customer on the wrong line","Route them properly"],["Testing you","Fast, clear, honest answer builds certainty"]],
 goal:"Answer the question completely first, then ask ONE question that opens the call.",
 tech:["Reciprocity","No-oriented Q","Calibrated Q"],
 scripts:[
  ["Answer, then open","Great question, {answer}. Can I ask what got you looking into DISH today?"],
  ["No-oriented","Is it a bad time to take sixty seconds and see what you’d actually pay? If it doesn’t fit, no hard feelings at all."],
  ["If it’s about price","The real answer depends on the plan you qualify for, I can have your exact number in about a minute. Want me to check?"],
  ["Existing customer","That sounds like an account question, the right team is customer service at 1-800-333-3474. [VERIFY: transfer process]"]
 ],
 dont:["Dodging their question to force a pitch","Talking over them when they try to end the call"],
 rel:["price-first","just-looking"]
});

add({id:"just-looking", cat:"open", title:"“I’m just shopping around”",
 sub:"Comparing providers",
 say:["I’m just looking","I’m comparing prices","I’m calling a few companies","Not ready to buy today"],
 means:[["Real comparison","Help them compare apples to apples"],["Wants to avoid pressure","Permission to say no"],["Has a quote already","Ask what it is"]],
 goal:"Become the quote they compare everything else against, with the total, not the ad price.",
 tech:["Up-front contract","Calibrated Q","Permission to say no"],
 scripts:[
  ["Main","Smart, you should compare. So you’re comparing apples to apples, let me get you your real price, including what’s due today. Most quotes you’ll get only show the ad price."],
  ["What are they comparing","Who else are you looking at, and what did they quote you? Did that include equipment, the DVR, locals and taxes, and is it locked for two years?"],
  ["Decision criteria","What would make you pick one over the other?"],
  ["Permission","If at the end it’s not the best fit for you, tell me straight. I’d rather you know."]
 ],
 rel:["cheaper","price-first"]
});

add({id:"busy", cat:"open", title:"“I don’t have time right now”",
 sub:"Tries to leave early",
 say:["I’m busy","I’m at work","Can I call back later?","I only have a minute"],
 means:[["Truly busy","Offer the shortest path or a path back"],["Exit","Permission to say no"]],
 goal:"Either get 5 focused minutes now or leave them with an exact plan to return, we can’t call them.",
 tech:["No-oriented Q","If-then plan"],
 scripts:[
  ["No-oriented","Is it a bad time right now, or could you give me five minutes to lock this in so you don’t have to start over later?"],
  ["Can’t call back","Just so you know, I’m not able to call you back. So if now’s not good, let me tell you exactly what to have ready so the next call takes five minutes."],
  ["Short path","Let’s do the fast version: name, address, and I’ll tell you your exact price. If you like it, great; if not, you’re done in three minutes."]
 ],
 back:true,
 dont:["“I’ll call you back.” (we can’t)"],
 rel:["callback"]
});

add({id:"order-online", cat:"open", title:"“I’ll just order online”",
 sub:"Wants to do it on the website",
 say:["I’ll do it on the website","I’ll order online","Can I just sign up online?"],
 means:[["Prefers self-service","Offer to do it together, same speed"],["Wants less pressure","Permission to say no"],["Thinks online is cheaper","Clarify"]],
 goal:"Show what a person adds (qualification, equipment choices, answers) and finish together now.",
 tech:["Reframe","No-oriented Q"],
 scripts:[
  ["Main","You can. The difference is I can check which plan you qualify for right now and answer the equipment and install questions as we go, and if anything looks off you’ve got a person to fix it. Would it be crazy to just do it together? It’s about the same time."],
  ["If they think online is cheaper","Good thought. Let me check your actual price here first, then you can compare. [VERIFY: online vs phone offer differences]"]
 ],
 verify:["Whether online offers differ from phone offers"],
 rel:["just-looking"]
});

/* ---------- INFO & CREDIT ---------- */
add({id:"why-info", cat:"info", hot:true, title:"“Why do you need all my info / my Social?”",
 sub:"Pushes back during info capture or before credit",
 say:["Why do you need my Social?","I don’t give that out over the phone","Why do you need my email?","Why do you need my address?"],
 means:[["Identity-theft fear","Explain exactly how it’s used"],["Knows credit is bad (embarrassed)","Normalize: options for every credit situation"],["Distrust of DISH / reviews","Transparency, reason for each item"]],
 goal:"Explain the purpose of each item in plain words and get consent, no pressure.",
 tech:["Label","Reciprocity","Permission to say no"],
 scripts:[
  ["Main","Good question, you should ask. The address tells me exactly which channels and locals you can get at your home. The Social is for the credit check that decides what you’d pay today, some customers pay nothing up front. It’s only used for this account."],
  ["Why it protects them","Everything I ask is so I give you the right price the first time and your first bill matches what I tell you, that’s the number one complaint people have about TV companies."],
  ["Label","It sounds like you’ve been burned before, or you’re just careful with your information, and that’s smart. What would make you comfortable?"]
 ],
 push:[["“Can I do it without my Social?”","For our standard plans, DISH requires the Social of the person signing, plus credit approval. Let me check what options we have for you. [VERIFY: options without SSN / prepaid]"],
       ["“Will it hurt my credit?”","[VERIFY: exact wording your center uses for the type of credit inquiry], don’t guess on this one."]],
 dont:["“Everyone gives it.”","Claiming it doesn’t affect credit unless verified","Pressuring after a clear no"],
 verify:["Type of credit inquiry and approved wording","Options for customers who won’t give an SSN"],
 rel:["no-credit","no-ssn","scam"]
});

add({id:"no-credit", cat:"info", title:"“I don’t want a credit check / my credit is bad”",
 sub:"Afraid of the result",
 say:["My credit is bad","I don’t want you running my credit","I won’t get approved","Do you do credit checks?"],
 means:[["Embarrassed about credit","Normalize; there are options for every credit situation"],["Worried about score impact","Answer with verified wording only"],["Expects to be denied","Explain the four outcomes, nobody just “fails”"]],
 goal:"Remove the fear: the check only decides WHICH option fits, not whether they can have TV.",
 tech:["Label","Reframe","Feel-felt-found (own words)"],
 scripts:[
  ["Main","I appreciate you telling me, you’re definitely not the only one, and bad credit doesn’t mean no. The check just decides which of our options fits you. There’s even an option where you pay up front instead of on credit."],
  ["Best/worst case","Best case, you pay nothing today. Worst case, you’d be on an option where you pay some up front. Either way you’ll know exactly before you decide anything. Want to find out which one?"],
  ["Label","It sounds like you’ve been turned down before and don’t want to go through that again. Is that right?"]
 ],
 dont:["“Your credit will be fine.” (you can’t promise)","Anything that shames their credit"],
 verify:["Type of inquiry","Whether FlexTV requires a credit check at your center"],
 rel:["why-info","upfront-why","equipment-buy"]
});

add({id:"not-holder", cat:"info", title:"“It’s for my mom / put it in my spouse’s name”",
 sub:"Caller isn’t the person who will sign",
 say:["It’s for my mother","Put it in my husband’s name","I’m calling for my son","Can I use my wife’s Social?"],
 means:[["Helping a family member","Get the account holder on the call"],["Trying to get a better tier with someone else’s credit","Only with that person present and consenting"]],
 goal:"The person on the account must be the one who agrees and gives their own info. Get them on the line.",

  ["While waiting","I can do all the setup with you, channels, equipment, install, and we’ll just need {name} for the last part."]
 ],
 dont:["Taking someone else’s SSN without them on the call","Letting the caller “answer for” an absent account holder"],
 verify:["Your center’s rule on third-party callers / authorized users"],

add({id:"no-ssn", cat:"info", title:"“I don’t have a Social Security number”",
 sub:"ITIN / no SSN",
 say:["I don’t have a Social","I have an ITIN","Can I use my passport?"],
 means:[["Genuinely no SSN","Check which options exist; don’t guess"]],
 goal:"Be honest about the requirement and check what your center can offer.",
 tech:["Label"],
 scripts:[
  ["Main","Thanks for telling me. Our standard plans require a Social Security number for the person signing, so let me check what I can do for you. [VERIFY: prepaid/no-credit-check options and ID accepted]"]
 ],
 dont:["Suggesting they use someone else’s SSN"],
 verify:["Options without an SSN (prepaid / FlexTV)"],
 rel:["not-holder"]
});

add({id:"upfront-why", cat:"info", hot:true, title:"“Why do I have to pay? The ad said $0”",
 sub:"Disappointed by the tier result",
 say:["Why do I pay upfront?","The commercial said no money down","My neighbor pays less","Why is my price higher?","That’s not what the website said"],
 means:[["Feels bait-and-switched","Explain the four plans calmly, this is exactly why you didn’t quote early"],["Embarrassed about credit","Never mention “bad credit”; talk about “the plan that came back”"],["Price shock","Break down exactly what’s due and why"]],
 goal:"Keep trust: explain how qualification works, show the exact breakdown, then look for legitimate ways to lower it.",
 tech:["Label","Reframe","Loop (3 Tens)"],
 scripts:[
  ["Main","I get why that’s frustrating. The ad shows the price for the top plan. The credit check puts everyone into one of four plans, and yours came back as {tier}. That’s exactly why I didn’t want to quote you before checking. Here’s what’s due and why: {breakdown}.","f24"],
  ["Main (FlexTV)","I get why that’s frustrating. The ad shows the top plan. Yours came back as the prepaid option, which means you pay up front, including the equipment, instead of on credit. Here’s the exact amount: {breakdown}.","ftv"],
  ["Reframe","The up-front part is what lets DISH set you up without the top credit plan, it’s the way in, not a penalty."],
  ["Lower it","Let me see if I can bring what’s due today down, can I ask how many TVs you really need, and whether the DVR is a must?"]
 ],
 push:[["“Can you run it again?”","[VERIFY: whether re-runs or a co-applicant are allowed], if not: I can’t change the result, but I can help you make the best of it."]],
 dont:["“Your credit is bad.”","Blaming the customer","Promising a re-run will change it"],
 verify:["Re-run / co-applicant rules","Which equipment changes reduce what’s due"],
 rel:["no-money","down-payment","too-expensive"]
});

/* ---------- MONEY & PAYMENT ---------- */
add({id:"no-money", cat:"money", hot:true, title:"“I don’t have the money right now”",
 sub:"The #1 call-killer after the reveal",
 say:["I don’t have the money on me","I’ll call back when I have it","I can’t do that today","Money’s tight right now"],
 means:[["True timing gap (money comes later)","Pin down the date → payday plan"],["True shortfall","Levers: equipment, package, TVs; honest “not yet”"],["Smokescreen (not convinced)","Loop back to value and trust"],["Testing you","Answer calmly, move on"],["Embarrassed","Normalize, no judgment"],["Spouse / joint money","→ spouse objection"],["Wants “later” without saying no","Permission to say no + isolate"]],
 note:"Most Flex24 and FlexTV callers already know they’ll start with something. They are buyers. What kills the call is hearing the amount before they feel the value, or hearing an agent over-explain it.",
 goal:"Find out WHICH money it is, (A) old balance, (B) due today, (C) monthly, then solve it now or lock a specific path back.",
 tech:["Label","Calibrated Q","Isolate","If-then plan"],
 scripts:[
  ["H·I: Label","Okay. It sounds like you’re happy with the package, and the money side is what’s in the way today. Is that right?"],
  ["D: Which money?","Which part is the concern, the old balance, what’s due today, or the monthly?"],
  ["D: Timing vs amount","Is it not having it, or not having it yet?"],
  ["D: Isolate","Besides the money, is there anything else holding you back?"],
  ["D: Conditional","If we could make the money part work, would you want to go ahead today?"],
  ["E: Elite/Plus","The good news is you don’t pay anything today, no bill, no activation, no equipment lease. So I want to make sure I understand what’s making it feel like a money issue.","ep"],
  ["E: Flex24","Here’s exactly what’s due today: the first bill plus the $75 for activation and leasing. Let me see if there’s a way to bring that down or line it up with when you get paid.","f24"],
  ["E: FlexTV","Because this option is prepaid, today’s amount includes the equipment. Let me see if we can lower it with different equipment or fewer TVs.","ftv"],
  ["S: Secure","So we don’t lose everything we just set up, when is the money available? This week?"]
 ],
 push:[["“I just don’t have it.”","→ go to “I don’t get paid until…” if they give a date, or “Honest not yet” if they can’t."],
       ["“I’ll call you back.”","→ “Let me call you back” objection: we can’t call out, build the path back."]],
 back:true,
 dont:["“No problem, call me back.”","“You already knew there was a down payment.”","“Borrow it from someone.”","“It’s only ${amount}.”","Promising a price will be gone tomorrow"],
 verify:["Can install be scheduled after payday with payment at install?","Can the order/credit result be held? For how long?","Which equipment/package changes lower what’s due"],
 rel:["payday","past-due","down-payment","not-yet"]
});

add({id:"payday", cat:"money", hot:true, title:"“I don’t get paid until Friday / the 1st”",
 sub:"Round 2 of no-money: the money exists, on a date",
 say:["I get paid on Friday","Not till the first of the month","I get paid in two days","My check comes on the 3rd","That sounds good but I still don’t get paid till…"],
 means:[["The money exists: timing only","Stop fighting “no”; manage the date"],["Soft exit using a date","Isolate: is timing the ONLY thing?"]],
 goal:"Turn their date into the plan: exact day, time, amount, then either set things up around it now or lock an if-then plan.",
 tech:["Mirror","Isolate","Calibrated Q","No-oriented Q","If-then plan"],
 scripts:[

/* Qualification needs SSN + date of birth + a credit/debit card. The customer weighs all three
   against a price they haven't heard yet, that is the lens for every opening objection. */
function patch(id, f){ const o = O.find(x=>x.id===id); if(o) Object.assign(o, f); }

 scripts:[

  ["Up-front contract","Here’s how I’ll make this worth your time: your price depends on the plan you qualify for, and a lot of people pay nothing today. A few quick questions, and you leave with your real number, not an ad. Deal?"],
  ["Confident-credit caller","If your credit’s in good shape, that’s exactly what gets you the best offer, $0 today and the lower rate. Let’s make it work for you."],
  ["Discovery bridge","Before I check anything, what are you watching now, and what are you paying? That way I compare against what you’ve actually got."],

  goal:"You know the tier, the exact due-today amount, and whether there’s an old balance, before you speak.",
  exit:["Tier known","Due-today amount known to the cent","Old balance checked"],
  clar:[["If they ask what plan they got","You came back on {tier}. In plain terms, that means {what’s due today}. Let me walk you through the whole thing."]]},

 {t:"Price reveal: B.R.I.D.G.E.", mins:2,
  p:"Every tier hears the same reveal: their own words, the value, then the monthly price. Nothing about money due today until they have reacted to the monthly. When you do say it, it is one flat sentence followed by a question about the install day. Do not apologise for it, do not justify it, and do not explain it unless they ask. Over-explaining is what makes a set-up amount sound like a problem.",
  goal:"They feel the value and react to the monthly before any set-up amount is mentioned, and they hear both numbers clearly before the close.",
  exit:["You used at least two things they told you","You said the monthly once, then stopped talking","They reacted before you mentioned anything due today","The set-up amount was one sentence, no apology, no speech"],
  s:[["1. The reveal (identical for every tier)","{cust}, here’s what I put together for you. You told me {their words}. So: {package} with {their channels}, the Hopper on all {TVs} TVs recording up to 16 shows at once, free standard installation, and your price locked for two years. It’s {price} a month. … How does that sit with you?"],
     ["2. Then stop talking","(Say nothing. Let them answer first. Whoever fills the silence gives something away.)"],
     ["3. Set-up today: Elite / Plus","And to get you started, there’s nothing to pay today. What day works for the install?","ep"],
     ["3. Set-up today: Flex24","And to get you started today it’s {amount}. What day works for the install?","f24"],
     ["3. Set-up today: FlexTV","And to get you started today it’s {amount}, and that covers your equipment as well. What day works for the install?","ftv"],
     ["If they ask what the amount is for","It’s the set-up on your plan: {breakdown}. After that it’s {price} a month, locked. (One sentence, then stop.)"],
     ["If they say they don’t have it today","Go to “I don’t have the money right now”. Do not re-sell the package, solve the calendar."]],
  clar:[["If they say “I don’t understand what I’m paying”","Let me split it in two. Every month: {price}. To start: {amount}. Those are the only two numbers. Which one do you want me to break down?"]],
  warn:"Mistake: leading with the down payment, or softening it with “unfortunately”. Flex24 and FlexTV callers are buyers, most of them already expect to start with something. Treat every tier exactly like an Elite customer: same energy, same pride in the offer. The set-up amount is a logistics detail, not a verdict on them."},
 {t:"Objection, then every pushback", mins:5,
  p:"First objection: H.I.D.E.S. Every pushback after that: S.T.A.Y. Never let it end on “I’ll call back”. If they say they don’t understand, switch to E.A.S.Y. before you answer anything else.",
  goal:"The real objection is named, answered, and followed by a question that keeps them on the call.",
  exit:["You isolated: “besides that, anything else?”","Every answer ended with a question, not a goodbye"]},

 {t:"Lock it in", mins:3,
  p:"Close now, or climb down the lock-in ladder: create the order with a future install, get the decision-maker on speaker, lower what’s due. The path back is the last rung.",
  goal:"A yes on this call, or the highest rung of the ladder they’ll agree to.",
  exit:["Install date chosen","Decision-maker handled, not deferred","If they left: an if-then plan they repeated back"],
  clar:[["If they say “what am I agreeing to?”","Good, you should ask. In plain words: {what creating the order does}. Nothing gets installed until {date}, and nothing changes before that. [VERIFY]"]]},

 {t:"Recap, install and human close", mins:2,
  p:"Read back every line. The first bill has to match what you said. Then end like a person, not a script.",
  goal:"They can repeat the price, the due-today, the term and the install date without you prompting.",
  exit:["Every number read back","They confirmed it matches what they expected","Install date and window confirmed"],
  s:[["Recap","So we’re set: {package} at {price} a month, locked two years, 24-month agreement, $20 per month left if you cancel early with a max of $480, automatic monthly payment, {due today} today, install on {date}. Does that match what you expected?"],
     ["Close","Thanks, {cust}. Enjoy {their team or show}. If anything on your first bill doesn’t match what I told you, call us."]],
  clar:[["If they say “say that again?”","Of course. Two numbers: {due today} today, {price} a month. One date: {install date}. That’s it."]]}
];

add({id:"dont-understand", cat:"open", hot:true, title:"“I don’t understand what you mean”",
 sub:"Confusion, and it can happen at any step",
 say:["I don’t understand","What do you mean?","You lost me","Can you say that again?","Huh?","I’m not following you"],

 goal:"Own it, shrink it, give an example, then re-ask one simple thing. Never repeat the same sentence louder.",
 tech:["E.A.S.Y.","Label","Permission to say no"],
 scripts:[
  ["E: Own it","That’s on me, I said that in a complicated way. Let me try again."],
  ["A + S: Shrink it and give an example","Simply: {one idea}. For example, {everyday example}."],
  ["Y: Re-ask one thing","So just this one thing: {simple question}?"],
  ["Check the line","Also, can you hear me okay? I can speak up or slow down."],
  ["Language","Would you be more comfortable in Spanish? I can transfer you. [VERIFY transfer process]"],
  ["If it keeps happening","I don’t want to talk past you. Which part is fuzzy: what DISH is, what it costs, or what happens today?"],
  ["Give them the floor","Tell me what you’d want to know, and I’ll answer just that."]
 ],
 dont:["Repeating the same sentence louder","“Like I said…”","Jargon with no plain-words version: qualification, activation, leasing, autopay, prorated","Rushing on before they say they’re with you"],
 verify:["Spanish transfer process"],
 rel:["spanish","tech-hard","why-info","scam"]
});

add({id:"what-is-starlink", cat:"basics", hot:true, product:"internet", title:"“What is Starlink? Is this the same as my TV dish?”",

/* ===================== HELPERS ===================== */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function fmt(t){
  let h = esc(t);
  h = h.replace(/\[VERIFY[^\]]*\]/g, m => `<span class="vf">${m.slice(1,-1)}</span>`);
  h = h.replace(/\{[^}]+\}/g, m => `<span class="ph">${m}</span>`);
  return h;
}
/* Browser storage with an in-memory fallback (some previews and private windows block storage) */
const MEM = {};
const STORAGE_OK = (()=>{ try{ localStorage.setItem("op__t","1"); localStorage.removeItem("op__t"); return true; }catch(e){ return false; } })();
const store = {
  get(k,d){ try{ const v = localStorage.getItem("op_"+k); return v===null?d:v; }catch(e){ return k in MEM ? MEM[k] : d; } },
  set(k,v){ MEM[k] = v; try{ localStorage.setItem("op_"+k,v); }catch(e){} }
};
function copyText(text, btn){
  const done = () => { btn.textContent="Copied"; btn.classList.add("done"); setTimeout(()=>{btn.textContent="Copy";btn.classList.remove("done");},1200); };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, ()=>fallback());
  else fallback();
  function fallback(){ const ta=document.createElement("textarea"); ta.value=text; ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select(); try{document.execCommand("copy");}catch(e){} ta.remove(); done(); }
}
function scriptHTML(label, text, tier){
  const tb = tier && tier!=="all" ? `<span class="badge tier">${TIERS[tier]}</span>` : "";
  return `<div class="script"><div class="lab">${esc(label)} ${tb}</div><div class="txt">${fmt(text)}</div><button class="copy" data-copy="${esc(text)}">Copy</button></div>`;
}

/* ===================== STATE ===================== */
let state = { cat:"all", tier: store.get("tier","all"), q:"", sel: null, stage:"", product: store.get("product","tv") };

/* ===================== OBJECTION LIST ===================== */
function matches(o, q){
  if(!q) return true;
  const hay = [o.title,o.sub,(o.say||[]).join(" "),(o.tech||[]).join(" "),(o.scripts||[]).map(s=>s[1]).join(" "),(PUSH[o.id]||[]).map(p=>p[1]).join(" "),CX[o.id]||"",catsFor(o.product)[o.cat]].join(" ").toLowerCase();
  return q.toLowerCase().split(/\s+/).filter(Boolean).every(w => hay.includes(w));
}
function renderCats(){
  const cm = catsFor(state.product);
  const c = [["all","All"],["hot","Top leaks"],...Object.entries(cm)];
  $("#cats").innerHTML = c.map(([k,v]) => `<button class="chip" data-cat="${k}" aria-pressed="${state.cat===k}">${v}</button>`).join("") +
    (state.product==="tv" ? `<select id="stageSel" class="stage-sel" aria-label="Filter by call-flow step"><option value="">Any call step</option>${STAGES.map((n,i)=>`<option value="${i+1}"${+state.stage===i+1?" selected":""}>Step ${i+1}: ${n}</option>`).join("")}</select>` : "");
}
function score(o, q){
  const ws = q.toLowerCase().split(/\s+/).filter(Boolean);
  const t = (o.title+" "+o.sub).toLowerCase(), s = (o.say||[]).join(" ").toLowerCase();
  const ql = q.toLowerCase().trim();
  return ws.reduce((n,w)=> n + (t.includes(w)?3:0) + (s.includes(w)?2:0), 0) + (t.includes(ql)?6:0) + (s.includes(ql)?4:0) + (o.hot?0.5:0);
}
function filtered(){
  const r = O.filter(o => o.product===state.product && (state.cat==="all" || (state.cat==="hot" ? o.hot : o.cat===state.cat)) && matches(o, state.q) && (!state.stage || (STAGE_OF[o.id]||[]).includes(+state.stage)));
  return state.q ? r.sort((a,b)=>score(b,state.q)-score(a,state.q)) : r;
}
function renderList(){
  const list = filtered();
  if(!list.length){ $("#items").innerHTML = `<div class="empty">No match. Try fewer words, e.g. “paid”, “spouse”, “contract”.</div>`; return; }
  let html = "", last = null;
  const cm = catsFor(state.product);
  const sorted = state.q ? list : [...list].sort((a,b)=>Object.keys(cm).indexOf(a.cat)-Object.keys(cm).indexOf(b.cat));
  for(const o of sorted){
    if(!state.q && o.cat!==last){ html += `<div class="group-h">${cm[o.cat]}</div>`; last=o.cat; }
    html += `<button class="item" data-id="${o.id}" aria-current="${state.sel===o.id}"><span class="t">${esc(o.title)}${o.hot?'<span class="hot">●</span>':""}</span><span class="s">${(STAGE_OF[o.id]||[]).map(n=>`<span class="stn">${n}</span>`).join("")}${esc(o.sub||"")}</span></button>`;
  }
  $("#items").innerHTML = html;
}

/* ===================== HOME / DETAIL ===================== */
const HIDES = [["H","Hear","Pause. Let them finish."],["I","Identify","Label the feeling. Get “that’s right.”"],["D","Diagnose","1-2 questions. Isolate: “anything else?”"],["E","Engineer","Honest options by tier."],["S","Secure","Ask for a specific step now."]];
function stepsHTML(arr){ return `<div class="hides" style="--n:${arr.length}">${arr.map(h=>`<div><b>${h[0]}</b><strong>${h[1]}</strong><br>${h[2]}</div>`).join("")}</div>`; }

function renderHome(){
  if(state.product==="internet"){
    const hotI = O.filter(o=>o.product==="internet" && o.hot);
    $("#detail").innerHTML = `
    <div class="card"><h3>Starlink internet — objections &amp; questions</h3><p class="note" style="margin:0">Search exactly what the customer asked, or pick a category on the left. Written for first-time, non-technical customers — assume nothing is obvious, and never assume they know a term the first time you use it. Placeholders look like <span class="ph">{this}</span>; <span class="vf">VERIFY</span> means confirm the exact number or policy with your center before saying it as fact.</p></div>
    <div class="card"><h3>Most common first questions</h3><div class="home-top">${hotI.map(o=>`<button class="leak" data-id="${o.id}"><b>${esc(o.title)}</b><span>${esc(o.sub)}</span></button>`).join("")}</div></div>
    <div class="card"><h3>House rules for Internet calls</h3>
     <ul class="dont"><li><b>Never assume they know a term.</b> WiFi, router, browser, app — define it plainly the first time, every time.</li><li><b>Slow down more than you think you need to.</b> Check understanding after every explanation instead of plowing ahead.</li><li><b>Lead with what it lets them do</b> — video calling grandkids, email, looking things up — not speed numbers or tech specs.</li><li><b>Never guess at pricing, fees, contract terms or refund policy.</b> These change — confirm the current numbers with your center every time, don't repeat an old figure from memory.</li><li><b>We can’t call out.</b> Same house rule as TV — solve it on this call, the callback is the last resort.</li><li><b>Take medical-safety questions (pacemakers, hearing aids) seriously.</b> Don't improvise reassurance — point to a verified source or the device manufacturer.</li></ul></div>`;
    return;
  }
  const hot = O.filter(o=>o.product==="tv" && o.hot);
  $("#detail").innerHTML = `
  <div class="card"><h3>1st objection: H.I.D.E.S.</h3>${stepsHTML(HIDES)}
   <h3>Every pushback after that: S.T.A.Y.</h3>${stepsHTML(STAY)}
   <p class="note" style="margin:10px 0 0">Search what the customer said, or pick from the list. Set the <b>Tier</b> after qualification to see only the scripts that apply. Placeholders look like <span class="ph">{this}</span>; <span class="vf">VERIFY</span> means confirm with your center first.</p></div>
  <div class="card"><h3>Price reveal: B.R.I.D.G.E. (never just say the price)</h3>${stepsHTML(BRIDGE)}</div>
  <div class="card"><h3>What the 2nd objection really means</h3><div class="tbl-wrap"><table><thead><tr><th>Pushback type</th><th>Sounds like</th><th>Move</th></tr></thead><tbody>${Object.entries(PT).map(([k,v])=>`<tr><td><span class="badge pt-${k}">${v[0]}</span></td><td>${esc(v[2])}</td><td>${esc(v[1])}</td></tr>`).join("")}</tbody></table></div>
   <ul class="dont" style="margin-top:10px"><li><b>Never end on “I’ll call back.”</b> Every pushback answer ends with a question that keeps them on the call.</li><li><b>Three-strike rule:</b> same objection three times with no movement → switch lever, or give the honest exit.</li></ul></div>
  <div class="card"><h3>Top leaks: where calls die</h3><div class="home-top">${hot.map(o=>`<button class="leak" data-id="${o.id}"><b>${esc(o.title)}</b><span>${esc(o.sub)}</span></button>`).join("")}</div></div>
  <div class="card"><h3>House rules on every call</h3>
   <ul class="dont"><li><b>Be a person before you’re a price.</b> Bond, recap, value, then the number.</li><li><b>Every tier gets the Elite treatment.</b> Same energy, same pride in the offer. Value and the monthly first; what’s due today comes after they react, in one flat sentence with no apology.</li><li><b>We can’t call out.</b> Lock it in on this call; the path back is the last resort.</li><li><b>No invented urgency, prices or discounts.</b> Broken rep promises are the #1 source of bad reviews.</li><li><b>No streaming, no mailed flyers.</b> Say it once, then pivot.</li><li><b>Never push a customer with no date and no amount</b> into a 24-month agreement.</li></ul></div>`;
}

function pushHTML(type, q, a){
  const ty = type && PT[type] ? `<span class="badge pt-${type}">${PT[type][0]}</span>` : "";
  const qq = type ? `“${esc(q)}”` : fmt(q);

function revealText(){
  const g = k => (SNAP[k]||"").trim();

  if(g("pain")) t += `You told me you’re tired of ${g("pain")}. `;

/* ---------- call pacer ---------- */
function elapsedMs(){ return CALL.acc + (CALL.running ? Date.now()-CALL.t0 : 0); }
function mmss(ms){ const s=Math.floor(ms/1000); return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0"); }
function phaseNow(){
  const m = elapsedMs()/60000; let acc = 0;
  for(const ph of PHASES){ acc += ph.mins; if(m < acc) return ph.n; }
  return PHASES[PHASES.length-1].n;
}
function tickPacer(){
  const t = $("#pacerTime"); if(!t) return;
  t.textContent = mmss(elapsedMs());
  const cur = CALL.running || CALL.acc ? phaseNow() : 0;
  document.querySelectorAll(".pchip").forEach(c => c.classList.toggle("on", +c.dataset.phase === cur));
}
setInterval(()=>{ if(CALL.running) tickPacer(); }, 1000);

   ${store.get("focus","")?`<div class="focusline"><b>This week’s focus:</b> ${esc(store.get("focus",""))}</div>`:""}<div class="pchips">${PHASES.map(p=>{ const from=mark; mark+=p.mins; return `<button class="pchip" data-phase="${p.n}" data-step="${p.steps[0]}"><b>Phase ${p.n}: ${esc(p.t)}</b><span>min ${from} to ${mark} · steps ${p.steps[0]} to ${p.steps[p.steps.length-1]}</span></button>`; }).join("")}</div></div>`;

     <details class="obj-at" open><summary><span class="oa-h">Jargon translator</span></summary><div class="tbl-wrap"><table><thead><tr><th>Don’t say (or explain it)</th><th>Say this instead</th></tr></thead><tbody>${JARGON.map(j=>`<tr><td>${esc(j[0])}</td><td>${esc(j[1])}</td></tr>`).join("")}</tbody></table></div></details></div>` +

function fetchOnce(url, ms){
  const c = new AbortController(); const t = setTimeout(()=>c.abort(), ms||12000);
  return fetch(url, {signal:c.signal}).then(r => { if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); }).finally(()=>clearTimeout(t));
}
async function fetchJSON(url, ms){
  try{ return await fetchOnce(url, ms); }
  catch(e){ if(/HTTP 404/.test(e.message)) throw e; await new Promise(r=>setTimeout(r,800)); return fetchOnce(url, ms); }
}
async function citySummary(city, state){
  try{
    const s = await fetchJSON(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent((city+", "+state).replace(/ /g,"_"))}`);
    if(s.type!=="disambiguation" && s.extract) return {extract:s.extract};
  }catch(e){}
  const j = await fetchJSON(`https://en.wikipedia.org/w/api.php?action=query&titles=${encodeURIComponent(city+", "+state)}&redirects=1&prop=extracts&exintro=1&explaintext=1&format=json&origin=*`);
  const pg = Object.values(j.query.pages)[0];
  if(!pg || pg.missing!==undefined || !pg.extract) throw new Error("no summary");
  return {extract:pg.extract};
}

async function rapportLookup(zip){
  if(RAPPORT_CACHE[zip]) return RAPPORT_CACHE[zip];
  const z = await fetchJSON("https://api.zippopotam.us/us/"+zip, 10000);
  const p = z.places[0];
  const base = { zip, city:p["place name"], state:z.places[0].state, st:p["state abbreviation"], lat:+p.latitude, lon:+p.longitude, other:z.places.slice(1).map(x=>x["place name"]) };
  /* Wikipedia calls run one after another (it throttles bursts); weather and map data run alongside */
  const settle = p => p.then(value=>({status:"fulfilled", value}), reason=>({status:"rejected", reason}));
  const wikiChain = (async () => { const a = await settle(citySummary(base.city, base.state)); const b = await settle(wikiPlaces(base.lat, base.lon)); return [a, b]; })();
  const [wx, food, [wiki, places]] = await Promise.all([
    settle(fetchJSON(`https://api.open-meteo.com/v1/forecast?latitude=${base.lat}&longitude=${base.lon}&current=temperature_2m,weather_code&temperature_unit=fahrenheit&timezone=auto`)),
    settle(fetchJSON(`https://nominatim.openstreetmap.org/search?q=restaurant&format=jsonv2&limit=30&extratags=1&bounded=1&viewbox=${base.lon-0.06},${base.lat+0.045},${base.lon+0.06},${base.lat-0.045}`)),
    wikiChain
  ]);
  const res = { ...base, errors:[] };
  if(wx.status==="fulfilled"){ const c = wx.value.current; res.weather = { temp:Math.round(c.temperature_2m), cond:WMO[c.weather_code]||"", time:c.time, tz:wx.value.timezone }; } else res.errors.push("weather");
  if(wiki.status==="fulfilled") res.summary = wiki.value.extract; else res.errors.push("city summary");
  if(places.status==="fulfilled") res.places = places.value; else res.errors.push("landmarks");
  if(food.status==="fulfilled"){
    const seen = new Set();
    res.local = food.value.filter(x=>x.name && !seen.has(x.name) && seen.add(x.name))
      .map(x=>({ name:x.name, cuisine:(x.extratags&&x.extratags.cuisine||"").replace(/;/g,", ").replace(/_/g," "), chain:!!(x.extratags&&(x.extratags.brand||x.extratags["brand:wikidata"])) }))
      .sort((a,b)=>a.chain-b.chain).slice(0,12);
  } else res.errors.push("nearby restaurants");
  if(!res.errors.length) RAPPORT_CACHE[zip] = res;
  return res;
}

async function wikiPlaces(lat, lon){
  const g = await fetchJSON(`https://en.wikipedia.org/w/api.php?action=query&list=geosearch&gscoord=${lat}|${lon}&gsradius=10000&gslimit=150&format=json&origin=*`);
  const ids = g.query.geosearch.map(x=>x.pageid);
  const out = [];
  for(let i=0; i<ids.length; i+=50){
    let j; try{ j = await fetchJSON(`https://en.wikipedia.org/w/api.php?action=query&pageids=${ids.slice(i,i+50).join("|")}&prop=pageviews|description&pvipdays=30&format=json&origin=*`); }catch(e){ continue; }
    for(const pg of Object.values(j.query.pages||{})){
      const views = Object.values(pg.pageviews||{}).reduce((a,b)=>a+(b||0),0);
      out.push({ title:pg.title, desc:pg.description||"", views });
    }
  }
  const cats = {food:[], fun:[], land:[]};
  for(const p of out.sort((a,b)=>b.views-a.views)){
    const txt = p.title+" "+p.desc;
    if(R_SKIP.test(p.desc) || R_EVENT.test(txt) || /^\d{4}\b/.test(p.title)) continue;
    const c = R_CATS.find(c=>c.re.test(txt));
    if(c && cats[c.k].length < 8) cats[c.k].push(p);
  }
  return cats;
}

function rapportLines(r){
  const L = [];
  if(r.weather) L.push(["Weather opener",`Oh, ${r.city}! How’s the weather treating you out there? Looks like it’s about ${r.weather.temp} degrees and ${r.weather.cond} right now.`]);
  const land = r.places && r.places.land[0], fun = r.places && r.places.fun[0], food = r.places && r.places.food.find(p=>/restaurant|barbecue|bbq|diner|caf[eé]|coffee|steakhouse|bakery|taqueria|pizzeria|eatery|deli|smokehouse|ice cream|donut|doughnut/i.test(p.desc));
  const loc = r.local && r.local.find(x=>!x.chain);
  if(food) L.push(["Food (famous spot)",`I see ${cleanTitle(food.title)} is out your way. That’s one of the best-known spots in the area. Ever been?`]);
  else if(loc) L.push(["Food (local spot)",`Is ${loc.name} anywhere near you? ${loc.cuisine?`Always good to have a ${loc.cuisine.split(",")[0]} place close by.`:"Ever tried it?"}`]);
  if(fun) L.push(["Fun",`What do you do for fun out there? Do you ever get out to ${cleanTitle(fun.title)}?`]);
  if(land) L.push(["Landmark",`Have you been to ${cleanTitle(land.title)}? That’s one of the best-known places around ${r.city}.`]);
  L.push(["Turn it back to them",`How long have you been in ${r.city}?`]);
  const kinds = {"Weather opener":["weather",""],"Food (famous spot)":["food",food&&cleanTitle(food.title)],"Food (local spot)":["local",loc&&loc.name],"Fun":["fun",fun&&cleanTitle(fun.title)],"Landmark":["land",land&&cleanTitle(land.title)],"Turn it back to them":["howlong",""]};
  return L.map(l=>[l[0], l[1], kinds[l[0]][0], {city:r.city, place:kinds[l[0]][1]||""}]);
}

  const pod = r.weather ? partOfDay(r.weather.time) : "";

async function runRapport(){
  const input = $("#zipIn"); const zip = (input.value||"").trim();
  const box = $("#rapportOut");
  if(!/^\d{5}$/.test(zip)){ box.innerHTML = `<div class="card"><p class="note" style="margin:0">Enter a 5-digit US zip code.</p></div>`; return; }
  box.innerHTML = `<div class="card"><p class="note" style="margin:0">Looking up ${esc(zip)}…</p></div>`;
  try{ rapportLast = await rapportLookup(zip); renderRapportResult(rapportLast); }
  catch(e){ box.innerHTML = `<div class="card"><p class="note" style="margin:0">${/HTTP 404/.test(e.message)?`${esc(zip)} isn’t a known US zip code. Double-check it with the customer.`:`Couldn’t reach the lookup service (${esc(e.message)}). Check the internet connection; the rest of the playbook works offline.`}</p></div>`; }
}

 warm:{label:"Warm", meter:5, signals:"Gives more than you asked, laughs, tells a little story.", move:"Ride it for one more question, then bridge to what they watch."},
 pain:{label:"Frustrated (pain)", meter:4, signals:"Vents about their current service, bill or outages.", move:"That’s gold. Ask one implication question. Don’t pitch yet."},
 neutral:{label:"Neutral", meter:3, signals:"One-word answers: “fine”, “yeah”, “a few years”.", move:"No more small talk. One light bridge straight into discovery."},

 suspicious:{label:"Suspicious", meter:2, signals:"“How do you know that?” “Why are you asking where I live?”", move:"Say exactly where it came from, drop it, move on. Never get cute."},

}
function sentGuideHTML(){

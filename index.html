   </div></div>
  <div class="card"><h2>Log a call</h2>
   <div class="zip-row" style="margin-bottom:10px">
    <button class="pbtn ${statsDraft.out==="sold"?"":"ghost"}" id="outSold">Sold</button>
    <button class="pbtn ${statsDraft.out==="lost"?"":"ghost"}" id="outLost">Not sold</button>
   </div>
   <div class="fields">
    <div class="field"><label for="logTier">Tier (optional)</label><select id="logTier"><option value="">Not known</option><option value="ep">Elite / Plus</option><option value="f24">Flex24</option><option value="ftv">FlexTV</option></select></div>
    ${statsDraft.out==="lost"?`<div class="field"><label for="logObj">Objection that killed it</label><select id="logObj"><option value="">Pick one</option>${opts}</select></div>
    <div class="field"><label for="logStep">Step it died at</label><select id="logStep"><option value="">Not sure</option>${STAGES.map((s,i)=>`<option value="${i+1}">${i+1}. ${s}</option>`).join("")}</select></div>`:""}
    <div class="field" style="grid-column:1/-1"><label for="logNote">What would you do differently? (no customer details)</label><input id="logNote" maxlength="140" placeholder="e.g. revealed the set-up amount before the monthly"></div>
   </div>
   <button class="pbtn" id="logSave"${statsDraft.out?"":" disabled"}>Save to my log</button></div>
  <div class="cols">
   <div class="card"><h2>Your biggest leaks</h2>${killers.length?`<table><thead><tr><th>Objection</th><th>Lost calls</th><th>Share</th></tr></thead><tbody>${killers.map(([id,n])=>`<tr><td><a href="#${id}" data-id="${id}" class="related-link">${esc(objTitle(id))}</a></td><td>${n}</td><td>${pct(n,lost.length)}</td></tr>`).join("")}</tbody></table>
     ${steps.length?`<p class="note">Calls die most at: ${steps.map(([s,n])=>`<button class="schip" data-step="${s}">Step ${s}: ${STAGES[s-1]} (${n})</button>`).join(" ")}</p>`:""}`:`<p class="note">Log a few lost calls and your top killers show up here.</p>`}</div>
   <div class="card"><h2>Close rate by tier</h2><table><tbody>${byTier.map(([t,w])=>`<tr><td>${t}</td><td>${pct(w.s,w.n)}</td><td class="note">${w.s}/${w.n}</td></tr>`).join("")}</tbody></table>
    <h3>This week’s one behavior</h3><select id="focusSel" class="stage-sel" style="width:100%;border-radius:9px;padding:7px"><option value="">Pick one to work on</option>${FOCUS.map(f=>`<option${f===focus?" selected":""}>${esc(f)}</option>`).join("")}</select>
    <p class="note">One change at a time sticks. It shows at the top of the call flow as a reminder.</p></div>
  </div>
  <div class="card"><h2>Recent calls</h2>${log.length?`<ul class="loglist">${log.slice(-25).reverse().map(x=>`<li><span class="sent s-${x.out==="sold"?"warm":"rushed"}">${x.out==="sold"?"Sold":"Not sold"}</span> <span class="note">${new Date(x.t).toLocaleString([], {month:"short",day:"numeric",hour:"numeric",minute:"2-digit"})}</span>${x.tier?` · ${TIERS[x.tier]}`:""}${x.obj?` · ${esc(objTitle(x.obj))}`:""}${x.step?` · step ${x.step}`:""}${x.note?`<div class="ql">${esc(x.note)}</div>`:""}<button class="copy" data-del="${x.t}">Delete</button></li>`).join("")}</ul>
   <button class="pbtn ghost" id="logClear">Clear all</button>`:`<p class="note">Nothing logged yet.</p>`}</div>`;
}
document.addEventListener("click", e => {
  const id = e.target.id;
  if(id==="outSold" || id==="outLost"){ statsDraft.out = id==="outSold" ? "sold" : "lost"; renderStats(); return; }
  if(id==="logSave" && statsDraft.out){
    const v = k => { const el = document.getElementById(k); return el ? el.value.trim() : ""; };
    const log = loadLog(); log.push({t:Date.now(), out:statsDraft.out, tier:v("logTier"), obj:statsDraft.out==="lost"?v("logObj"):"", step:statsDraft.out==="lost"?+v("logStep")||0:0, note:v("logNote")});
    saveLog(log); statsDraft = {out:null}; renderStats(); return;
  }
  const del = e.target.closest("[data-del]"); if(del){ saveLog(loadLog().filter(x=>String(x.t)!==del.dataset.del)); renderStats(); return; }
  if(id==="logClear" && confirm("Delete every logged call on this device?")){ saveLog([]); renderStats(); }
});
document.addEventListener("change", e => { if(e.target.id==="focusSel"){ store.set("focus", e.target.value); } });

/* ===================== EVENTS ===================== */
function setView(v){
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected", t.dataset.view===v));
  document.querySelectorAll(".view").forEach(s=>s.classList.toggle("on", s.id==="view-"+v));
  if(v==="lock") renderLock();
  if(v==="scen") renderScenarios();
  if(v==="rapport") renderRapport();
  if(v==="rapport2") renderRapport2();
  if(v==="stats") renderStats();
  if(v==="flow") renderFlow();
  if(v==="facts") renderFacts();
  window.scrollTo(0,0);
}
function applyProductUI(){
  document.querySelectorAll("[data-tv-only]").forEach(t=>{ t.style.display = state.product==="tv" ? "" : "none"; });
  const tierWrap = document.getElementById("tierWrap");
  if(tierWrap) tierWrap.style.display = state.product==="tv" ? "" : "none";
}
function syncProduct(){ document.querySelectorAll("#productSeg button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.product===state.product)); }
function setProduct(p){
  if(state.product===p) return;
  state.product = p;
  store.set("product", p);
  state.cat = "all"; state.q = ""; state.stage = ""; state.sel = null;
  try{ $("#q").value = ""; }catch(e){}
  syncProduct();
  applyProductUI();
  renderCats();
  const activeTab = document.querySelector('.tab[aria-selected="true"]');
  const curView = activeTab ? activeTab.dataset.view : "obj";
  const tvOnlyViews = ["scen","flow","rapport","lock"];
  if(p==="internet" && tvOnlyViews.includes(curView)){ setView("obj"); return; }
  renderList();
  renderHome();
  renderFacts();
  try{ history.replaceState(null,"",location.pathname); }catch(e){}
}
document.addEventListener("click", e => {
  const cp = e.target.closest("[data-copy]"); if(cp){ copyText(cp.dataset.copy, cp); return; }
  const prod = e.target.closest("[data-product]"); if(prod){ setProduct(prod.dataset.product); return; }
  const tab = e.target.closest(".tab"); if(tab){ setView(tab.dataset.view); return; }
  const go = e.target.closest("[data-goto]"); if(go){ e.preventDefault(); setView(go.dataset.goto); return; }
  const cat = e.target.closest("[data-cat]"); if(cat){ state.cat = cat.dataset.cat; renderCats(); renderList(); return; }
  const tier = e.target.closest("[data-tier]"); if(tier){ state.tier = tier.dataset.tier; store.set("tier",state.tier); syncTier(); if(state.sel) renderDetail(state.sel); return; }
  const it = e.target.closest("[data-id]"); if(it){ e.preventDefault(); setView("obj"); select(it.dataset.id); return; }
  if(e.target.id==="backBtn"){ select(null); return; }
});
function syncTier(){ document.querySelectorAll("#tierSeg button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.tier===state.tier)); }
$("#q").addEventListener("input", e => {
  state.q = e.target.value.trim();
  if(state.q) state.cat = "all";
  renderCats(); renderList();
  const f = filtered();
  if(state.q && f.length && window.innerWidth>860) select(f[0].id);
});
$("#q").addEventListener("keydown", e => { if(e.key==="Enter"){ const f=filtered(); if(f.length){ setView("obj"); select(f[0].id);} } });
document.addEventListener("keydown", e => {
  if(e.key==="/" && document.activeElement.tagName!=="INPUT"){ e.preventDefault(); setView("obj"); $("#q").focus(); $("#q").select(); }
  if(e.key==="Escape"){ $("#q").value=""; state.q=""; renderList(); $("#q").blur(); }
});
window.addEventListener("hashchange", ()=>{ const id=location.hash.slice(1); if(O.some(o=>o.id===id)){ setView("obj"); select(id,false);} });

/* Theme */
(function(){
  const saved = store.get("theme","");
  if(saved) document.documentElement.setAttribute("data-theme", saved);
  $("#themeBtn").addEventListener("click", ()=>{
    const cur = document.documentElement.getAttribute("data-theme") || (matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
    const next = cur==="dark"?"light":"dark";
    document.documentElement.setAttribute("data-theme", next); store.set("theme", next);
  });
})();

/* Back-to-top button for long pages on phones */
addEventListener("scroll", () => { const b = document.getElementById("toTop"); if(b) b.classList.toggle("show", scrollY > 700); }, {passive:true});
document.addEventListener("click", e => { if(e.target.id==="toTop") window.scrollTo({top:0, behavior:"smooth"}); });

/* Local time clock */
function tickClock(){
  const el = document.getElementById("localClock");
  if(!el) return;
  const now = new Date();
  el.textContent = now.toLocaleTimeString([], {hour:"2-digit", minute:"2-digit", second:"2-digit"}) + " local";
}
tickClock();
setInterval(tickClock, 1000);

/* Init */
syncProduct(); applyProductUI();
renderCats(); syncTier(); renderFlow(); renderFacts();
const startId = location.hash.slice(1);
if(O.some(o=>o.id===startId)){ select(startId,false); } else { renderList(); renderHome(); }
</script>
</body>
</html>
